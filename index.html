<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Mastery Pro</title>
    <style>
        :root {
            --primary: #4a6fa5;
            --success: #2ec4b6;
            --danger: #e71d36;
            --warning: #ff9f1c;
            --dark: #011627;
            --light: #f6f8fa;
            --card-bg: white;
            --text-color: #011627;
            --tile-bg: #edf2f7;
            --tile-text: #011627;
        }

        [data-theme="sunset"] {
            --primary: #e63946;
            --success: #2ec4b6;
            --warning: #ffb703;
            --light: #fae1dd;
            --card-bg: #ffffff;
            --text-color: #2b2d42;
            --tile-bg: #fcd5ce;
            --tile-text: #2b2d42;
        }

        [data-theme="forest"] {
            --primary: #2a9d8f;
            --success: #4bb543;
            --warning: #e9c46a;
            --light: #e8f5e9;
            --card-bg: #ffffff;
            --text-color: #1b4332;
            --tile-bg: #d8f3dc;
            --tile-text: #1b4332;
        }

        [data-theme="dark"] {
            --primary: #bb86fc;
            --success: #03dac6;
            --danger: #cf6679;
            --warning: #f48fb1;
            --light: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --tile-bg: #333333;
            --tile-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--light);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow: hidden;
        }

        .app-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 24px;
            position: relative;
            min-height: 590px;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<head>
    <style>
        .header-menu {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .menu-btn {
            background: var(--tile-bg);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 42px;
            background-color: var(--card-bg);
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.15);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--tile-bg);
            z-index: 110;
        }

        .dropdown-content button {
            color: var(--text-color);
            padding: 12px 16px;
            display: block;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
        }

        .dropdown-content button:hover {
            background-color: var(--tile-bg);
        }

        .dropdown-content .admin-panel-item {
            color: var(--primary) !important;
            border-top: 1px dashed var(--tile-bg);
            font-weight: bold;
        }

        .dropdown-content.show {
            display: block;
        }

        .screen {
            display: none;
            flex-direction: column;
            flex-grow: 1;
            margin-top: 20px;
        }

        .screen.active {
            display: flex;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            color: var(--primary);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .num-tile {
            background: var(--tile-bg);
            color: var(--tile-text);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 15px 0;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
        }

        .num-tile.selected {
            background: var(--primary);
            color: white;
            transform: scale(0.95);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-weight: bold;
            background: var(--tile-bg);
            color: var(--text-color);
            padding: 10px 15px;
            border-radius: 12px;
        }
    </style>
</head>
<head>
    <style>
        .quiz-flex-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            flex-grow: 1;
        }

        .problem-display {
            font-size: 48px;
            font-weight: 800;
            text-align: center;
            margin: 15px 0;
            letter-spacing: 2px;
        }

        .input-wrapper {
            margin-bottom: 12px;
        }

        input[type="number"], input[type="text"] {
            border: 2px solid var(--tile-bg);
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 14px;
            outline: none;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px;
            font-size: 24px;
            text-align: center;
        }

        input[type="number"]:focus, input[type="text"]:focus {
            border-color: var(--primary);
        }

        /* Responsive rows layout inside the parent configuration console screen */
        .admin-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            gap: 8px;
        }

        .admin-row input.admin-val {
            width: 65px;
            padding: 6px;
            font-size: 13px;
            text-align: center;
            border-radius: 8px;
        }

        .admin-row input.admin-txt {
            flex-grow: 1;
            padding: 6px 10px;
            font-size: 13px;
            border-radius: 8px;
        }

        .hint-btn {
            background: none;
            color: var(--text-color);
            opacity: 0.7;
            border: 1px dashed var(--tile-bg);
            padding: 8px;
            font-size: 13px;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            display: inline-block;
        }

        .hint-text {
            text-align: center;
            font-size: 14px;
            color: var(--warning);
            font-weight: bold;
            min-height: 20px;
            margin-bottom: 10px;
        }

        .feedback {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            min-height: 27px;
            margin-bottom: 10px;
        }

        .shop-container-wrapper {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--tile-bg);
            color: var(--text-color);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .shop-item.unlocked {
            border: 1px solid var(--success);
            background: rgba(46, 196, 182, 0.1);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .badge.locked { background: #cbd5e1; color: #64748b; }
        .badge.unlocked { background: var(--success); color: white; }

        button.action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            z-index: 10;
        }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        @keyframes bounce-pop { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
        .animate-pop { animation: bounce-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .particle { position: absolute; font-size: 24px; pointer-events: none; animation: floatUp 0.8s ease-out forwards; z-index: 10; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 1; } 100% { transform: translateY(-80px) scale(1.5); opacity: 0; } }
    </style>
</head>
<body ontouchstart="dismissKeyboard(event)">
<div class="app-container" id="app">
    <div class="header-menu">
        <button class="menu-btn" onclick="toggleMenu()">🎨</button>
        <div id="theme-dropdown" class="dropdown-content">
            <button onclick="setTheme('default')">🔵 Classic Blue</button>
            <button onclick="setTheme('sunset')">🌅 Sunset Minimal</button>
            <button onclick="setTheme('forest')">🌿 Forest Green</button>
            <button onclick="setTheme('dark')">🌙 Deep Dark</button>
            <button class="admin-panel-item" onclick="openAdminSettings()">⚙️ Admin Setup</button>
        </div>
    </div>

    <!-- SCREEN 1: FACTOR SELECTOR -->
    <div id="setup-screen" class="screen active">
        <h2>Select Tables to Quiz</h2>
        <div class="grid-container" id="grid"></div>
        <button class="action-btn" onclick="startQuiz()">Start Quiz 🚀</button>
    </div>

    <!-- SCREEN 2: ACTIVE UNBLOCKED QUIZ SCREEN -->
    <div id="quiz-screen" class="screen">
        <form class="quiz-flex-wrapper" onsubmit="handleFormSubmit(event)">
            <div class="stats-bar">
                <span>⭐ <span id="score-display">0</span> pts</span>
                <span id="retest-indicator" style="color: var(--danger); display:none;">🔄 Retest Zone</span>
                <span>Q: <span id="q-count">1</span>/<span id="q-total">10</span></span>
            </div>
            
            <div class="problem-display" id="problem">0 × 0</div>
            <div class="input-wrapper">
                <input type="number" id="answer-input" pattern="[0-9]*" inputmode="numeric" placeholder="Type answer & press Go...">
            </div>
            
            <div style="text-align: center;">
                <button type="button" class="hint-btn" id="hint-button" onclick="revealHint()">💡 Hint? (-1 pt)</button>
            </div>
            
            <button type="submit" class="action-btn" style="margin-bottom: 15px;">Submit Answer</button>
            
            <div class="hint-text" id="hint-display"></div>
            <div class="feedback" id="feedback"></div>
        </form>
    </div>

    <!-- SCREEN 3: COMPLETION BALANCES OVERVIEW -->
    <div id="reward-screen" class="screen">
        <h2>Quiz Complete!</h2>
        <div class="stats-bar" style="justify-content: center; font-size: 20px; gap: 10px; margin-bottom: 25px;">
            Total Balance: 💰 <span id="final-score">0</span> Points
        </div>
        <h3>Your Reward Milestones:</h3>
        <div id="shop-container" class="shop-container-wrapper"></div>
        <button class="action-btn" onclick="resetApp()">Practice Again 🔄</button>
    </div>

    <!-- SCREEN 4: ADVANCED ADMIN SYSTEM EDITOR -->
    <div id="admin-screen" class="screen">
        <h2>⚙️ Calibration Menu</h2>
        <div style="flex-grow: 1; overflow-y: auto; padding: 5px 2px;">
            <div class="admin-row"><strong>Feedback Hold (sec):</strong><input type="number" id="cfg-delay" class="admin-val" step="0.1" value="1.8"></div>
            <hr style="border: 0; border-top: 1px dashed var(--tile-bg); margin: 12px 0;">
            <p style="font-size: 13px; font-weight: bold; margin-bottom: 8px; opacity: 0.8;">Edit Rewards &amp; Targets:</p>
            <div class="admin-row"><input type="text" id="cfg-n1" class="admin-txt" value=""><input type="number" id="cfg-t1" class="admin-val" value="10"></div>
            <div class="admin-row"><input type="text" id="cfg-n2" class="admin-txt" value=""><input type="number" id="cfg-t2" class="admin-val" value="30"></div>
            <div class="admin-row"><input type="text" id="cfg-n3" class="admin-txt" value=""><input type="number" id="cfg-t3" class="admin-val" value="50"></div>
            <div class="admin-row"><input type="text" id="cfg-n4" class="admin-txt" value=""><input type="number" id="cfg-t4" class="admin-val" value="100"></div>
            <hr style="border: 0; border-top: 1px dashed var(--tile-bg); margin: 12px 0;">
            <button class="action-btn" style="background: var(--danger); padding: 12px; font-size: 14px; margin-bottom: 15px;" type="button" onclick="secureAdminClearPoints()">🛑 Reset All Point Data</button>
        </div>
        <button class="action-btn" type="button" onclick="saveAndExitAdmin()">Save & Exit Setup</button>
    </div>
</div>
<script>
    function dismissKeyboard(event) {
        const activeElement = document.activeElement;
        const inputField = document.getElementById('answer-input');
        if (activeElement && activeElement.tagName === 'INPUT' && event.target !== inputField && event.target.tagName !== 'BUTTON') {
            activeElement.blur();
        }
    }

    // Opens properly and fills custom string inputs cleanly
    function openAdminSettings() {
        document.getElementById("theme-dropdown").classList.remove("show");
        const entryPass = prompt("🔐 Enter Parent/Teacher Password:");
        
        if (entryPass === "1234") {
            const screens = document.querySelectorAll('.screen');
            screens.forEach(s => s.classList.remove('active'));
            
            // Map runtime states into form fields values
            document.getElementById('cfg-delay').value = (feedbackDelayDuration / 1000).toFixed(1);
            document.getElementById('cfg-n1').value = rewardShop[0].reward; document.getElementById('cfg-t1').value = rewardShop[0].points;
            document.getElementById('cfg-n2').value = rewardShop[1].reward; document.getElementById('cfg-t2').value = rewardShop[1].points;
            document.getElementById('cfg-n3').value = rewardShop[2].reward; document.getElementById('cfg-t3').value = rewardShop[2].points;
            document.getElementById('cfg-n4').value = rewardShop[3].reward; document.getElementById('cfg-t4').value = rewardShop[3].points;

            document.getElementById('admin-screen').classList.add('active');
        } else if (entryPass !== null) {
            alert("❌ Incorrect security access password.");
        }
    }

    // Handles absolute array updates mapping both strings and numerical thresholds safely
    function saveAndExitAdmin() {
        feedbackDelayDuration = parseFloat(document.getElementById('cfg-delay').value) * 1000;
        
        rewardShop[0].reward = document.getElementById('cfg-n1').value; rewardShop[0].points = parseInt(document.getElementById('cfg-t1').value);
        rewardShop[1].reward = document.getElementById('cfg-n2').value; rewardShop[1].points = parseInt(document.getElementById('cfg-t2').value);
        rewardShop[2].reward = document.getElementById('cfg-n3').value; rewardShop[2].points = parseInt(document.getElementById('cfg-t3').value);
        rewardShop[3].reward = document.getElementById('cfg-n4').value; rewardShop[3].points = parseInt(document.getElementById('cfg-t4').value);
        
        localStorage.setItem('cfg_feedback_delay', feedbackDelayDuration);
        localStorage.setItem('cfg_shop_models', JSON.stringify(rewardShop));

        alert("⚙️ Custom milestones and options updated successfully.");
        document.getElementById('admin-screen').classList.remove('active');
        document.getElementById('setup-screen').classList.add('active');
    }

    function secureAdminClearPoints() {
        const clearFinalConfirmation = confirm("💥 Clear current score metrics? Rewards will lock if balance falls below parameters.");
        if (clearFinalConfirmation) {
            currentScore = 0;
            localStorage.setItem('math_quiz_score', 0);
            document.getElementById('score-display').innerText = "0";
            document.getElementById('final-score').innerText = "0";
            renderShop();
            triggerHaptic('fail');
            alert("Balances cleared successfully.");
        }
    }

    function handleFormSubmit(event) { event.preventDefault(); submitAnswer(); }
    function toggleMenu() { document.getElementById("theme-dropdown").classList.toggle("show"); }
    function setTheme(themeName) { const docHtml = document.documentElement; if(themeName === 'default') { docHtml.removeAttribute('data-theme'); } else { docHtml.setAttribute('data-theme', themeName); } localStorage.setItem('math_quiz_theme', themeName); document.getElementById("theme-dropdown").classList.remove("show"); }
    const savedTheme = localStorage.getItem('math_quiz_theme') || 'default'; setTheme(savedTheme);
    
    window.onclick = function(event) { if (!event.target.matches('.menu-btn')) { const dropdowns = document.getElementsByClassName("dropdown-content"); for (let i = 0; i < dropdowns.length; i++) { let openDropdown = dropdowns[i]; if (openDropdown.classList.contains('show')) openDropdown.classList.remove('show'); } } }
    
    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playSound(type) { initAudio(); if(!audioCtx) return; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime; if (type === 'correct') { osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.1); gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3); } else if (type === 'wrong') { osc.frequency.setValueAtTime(220, now); osc.frequency.setValueAtTime(147, now + 0.15); gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4); osc.start(now); osc.stop(now + 0.4); } else if (type === 'bonus') { osc.frequency.setValueAtTime(587.33, now); osc.frequency.setValueAtTime(880, now + 0.08); osc.frequency.setValueAtTime(1174.66, now + 0.16); gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4); osc.start(now); osc.stop(now + 0.4); } }
    function triggerHaptic(type) { if (!navigator.vibrate) return; if (type === 'success') navigator.vibrate(40); else if (type === 'fail') navigator.vibrate(200); else if (type === 'hint') navigator.vibrate(20); }
    function spawnParticle(text, color) { const container = document.getElementById('app'); const p = document.createElement('div'); p.className = 'particle'; p.innerText = text; p.style.color = color; p.style.left = '45%'; p.style.top = '30%'; container.appendChild(p); setTimeout(() => p.remove(), 800); }
    let selectedFactors = [], currentScore = parseInt(localStorage.getItem('math_quiz_score')) || 0, currentQuestionIndex = 0, currentAnswer = 0, currentF1 = 0, currentF2 = 0, questionStartTime = 0, usedHint = false, isCurrentRetest = false;
    let normalQuestionsPool = [], retestQueue = [];
    
    let feedbackDelayDuration = parseFloat(localStorage.getItem('cfg_feedback_delay')) || 1800;
    
    // Fallback baseline array initialization values
    let rewardShop = [
        { points: 10, reward: "🥉 Bronze Star Badge" },
        { points: 30, reward: "🍦 Ice Cream Treatment" },
        { points: 50, reward: "🎮 15 Mins Extra Screen Time" },
        { points: 100, reward: "🏆 Ultimate Math Grandmaster" }
    ];
    
    // Load custom array string descriptions and numbers from storage memories
    const loadedShopModels = localStorage.getItem('cfg_shop_models');
    if (loadedShopModels) {
        try {
            const parsedShop = JSON.parse(loadedShopModels);
            for(let m=0; m<4; m++) {
                if(parsedShop[m] !== undefined) {
                    rewardShop[m].reward = parsedShop[m].reward;
                    rewardShop[m].points = parsedShop[m].points;
                }
            }
        } catch(e) {}
    }

    const grid = document.getElementById('grid');
    for (let i = 1; i <= 12; i++) {
        const tile = document.createElement('div'); tile.className = 'num-tile'; tile.innerText = i;
        tile.onclick = () => { tile.classList.toggle('selected'); if (selectedFactors.includes(i)) { selectedFactors = selectedFactors.filter(n => n !== i); } else { selectedFactors.push(i); } };
        grid.appendChild(tile);
    }

    function startQuiz() {
        if (selectedFactors.length === 0) { alert("Please pick at least one number table to practice!"); return; }
        initAudio(); currentQuestionIndex = 0; retestQueue = []; normalQuestionsPool = [];
        for(let i=0; i<10; i++) { let f1 = selectedFactors[Math.floor(Math.random() * selectedFactors.length)]; let f2 = Math.floor(Math.random() * 12) + 1; normalQuestionsPool.push({f1: f1, f2: f2}); }
        document.getElementById('q-total').innerText = normalQuestionsPool.length; document.getElementById('setup-screen').classList.remove('active'); document.getElementById('quiz-screen').classList.add('active'); document.getElementById('score-display').innerText = currentScore;
        generateQuestion();
    }

    function generateQuestion() {
        document.getElementById('feedback').innerText = ""; document.getElementById('hint-display').innerText = ""; document.getElementById('problem').classList.remove('animate-pop', 'animate-shake');
        const inputField = document.getElementById('answer-input'); inputField.value = ""; inputField.focus(); usedHint = false; document.getElementById('hint-button').disabled = false;

        if (retestQueue.length > 0 && (Math.random() > 0.4 || normalQuestionsPool.length === 0)) {
            let problemItem = retestQueue.shift(); currentF1 = problemItem.f1; currentF2 = problemItem.f2; isCurrentRetest = true; document.getElementById('retest-indicator').style.display = "inline";
        } else if (normalQuestionsPool.length > 0) {
            currentQuestionIndex++; let problemItem = normalQuestionsPool.shift(); currentF1 = problemItem.f1; currentF2 = problemItem.f2; isCurrentRetest = false; document.getElementById('retest-indicator').style.display = "none"; document.getElementById('q-count').innerText = currentQuestionIndex;
        } else { endQuiz(); return; }
        
        currentAnswer = currentF1 * currentF2;
        if (Math.random() > 0.5) {
            document.getElementById('problem').innerText = `${currentF1} × ${currentF2}`;
        } else {
            document.getElementById('problem').innerText = `${currentF2} × ${currentF1}`;
        }
        document.getElementById('problem').classList.add('animate-pop'); questionStartTime = Date.now();
    }

    function revealHint() { if (usedHint) return; usedHint = true; document.getElementById('hint-button').disabled = true; triggerHaptic('hint'); document.getElementById('hint-display').innerText = `Think: ${currentF1} groups of ${currentF2}. (Tip: ${currentF1} × ${currentF2 - 1} = ${currentF1 * (currentF2 - 1)})`; }

    function submitAnswer() {
        const inputField = document.getElementById('answer-input'); const userAnswer = parseInt(inputField.value); const feedbackEl = document.getElementById('feedback'); const displayEl = document.getElementById('problem');
        if (isNaN(userAnswer)) return;
        
        inputField.blur(); 
        const timeTaken = (Date.now() - questionStartTime) / 1000; let pointsEarned = 0;

        if (userAnswer === currentAnswer) {
            if (usedHint) {
                feedbackEl.innerText = "✅ Correct with Hint! +1 Point"; feedbackEl.style.color = "var(--success)";
                pointsEarned = 1; playSound('correct');
            } else if (timeTaken <= 4.0) {
                feedbackEl.innerText = "⚡ Lightning Fast! +4 Points"; feedbackEl.style.color = "var(--warning)";
                pointsEarned = 4; playSound('bonus');
            } else {
                feedbackEl.innerText = "✅ Correct! +2 Points"; feedbackEl.style.color = "var(--success)";
                pointsEarned = 2; playSound('correct');
            }

            currentScore += pointsEarned; triggerHaptic('success');
            spawnParticle(`+${pointsEarned}`, pointsEarned === 4 ? 'var(--warning)' : 'var(--success)');
        } else {
            feedbackEl.innerText = `❌ Incorrect. Retest added.`; feedbackEl.style.color = "var(--danger)"; displayEl.classList.add('animate-shake'); playSound('wrong'); triggerHaptic('fail'); retestQueue.push({f1: currentF1, f2: currentF2});
        }
        document.getElementById('score-display').innerText = currentScore; localStorage.setItem('math_quiz_score', currentScore);
        setTimeout(generateQuestion, feedbackDelayDuration);
    }

    function endQuiz() { document.getElementById('quiz-screen').classList.remove('active'); document.getElementById('reward-screen').classList.add('active'); document.getElementById('final-score').innerText = currentScore; renderShop(); }
    function renderShop() { const container = document.getElementById('shop-container'); container.innerHTML = ""; rewardShop.forEach(item => { const isUnlocked = currentScore >= item.points; const div = document.createElement('div'); div.className = `shop-item ${isUnlocked ? 'unlocked' : ''}`; div.innerHTML = `<div><strong>${item.reward}</strong><br><small style='opacity: 0.7;'>Requires ${item.points} total points</small></div><span class="badge ${isUnlocked ? 'unlocked' : 'locked'}">${isUnlocked ? '🎉 UNLOCKED' : '🔒 LOCKED'}</span>`; container.appendChild(div); }); }
    function resetApp() { document.getElementById('reward-screen').classList.remove('active'); document.getElementById('setup-screen').classList.add('active'); }
</script>
</body>
</html>
