<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>Math Mastery Pro</title>
  <style>
    :root {
      --primary: #4a6fa5;
      --success: #2ec4b6;
      --danger: #e71d36;
      --warning: #ff9f1c;
      --dark: #011627;
      --light: #f6f8fa;
      --card-bg: white;
      --text-color: #011627;
      --tile-bg: #edf2f7;
      --tile-text: #011627;
    }

    [data-theme="sunset"] {
      --primary: #e63946;
      --success: #2ec4b6;
      --warning: #ffb703;
      --light: #fae1dd;
      --card-bg: #ffffff;
      --text-color: #2b2d42;
      --tile-bg: #fcd5ce;
      --tile-text: #2b2d42;
    }

    [data-theme="forest"] {
      --primary: #2a9d8f;
      --success: #4bb543;
      --warning: #e9c46a;
      --light: #e8f5e9;
      --card-bg: #ffffff;
      --text-color: #1b4332;
      --tile-bg: #d8f3dc;
      --tile-text: #1b4332;
    }

    [data-theme="dark"] {
      --primary: #bb86fc;
      --success: #03dac6;
      --danger: #cf6679;
      --warning: #f48fb1;
      --light: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --tile-bg: #333333;
      --tile-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body {
      background-color: var(--light);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      /* allow scrolling on small screens */
    }

    .app-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 400px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 24px;
      position: relative;
      min-height: 590px;
      display: flex;
      flex-direction: column;
    }

    .header-menu {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 100;
    }

    .menu-btn {
      background: var(--tile-bg);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      top: 42px;
      background-color: var(--card-bg);
      min-width: 160px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.15);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--tile-bg);
      z-index: 110;
    }

    .dropdown-content button {
      color: var(--text-color);
      padding: 12px 16px;
      display: block;
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      font-size: 14px;
      cursor: pointer;
    }

    .dropdown-content button:hover {
      background-color: var(--tile-bg);
    }

    .dropdown-content .admin-panel-item {
      color: var(--primary) !important;
      border-top: 1px dashed var(--tile-bg);
      font-weight: bold;
    }

    .dropdown-content.show {
      display: block;
    }

    .screen {
      display: none;
      flex-direction: column;
      flex-grow: 1;
      margin-top: 20px;
    }

    .screen.active {
      display: flex;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 24px;
      color: var(--primary);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }

    .num-tile {
      background: var(--tile-bg);
      color: var(--tile-text);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 15px 0;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      user-select: none;
    }

    .num-tile[aria-pressed="true"] {
      background: var(--primary);
      color: white;
      transform: scale(0.95);
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-weight: bold;
      background: var(--tile-bg);
      color: var(--text-color);
      padding: 10px 15px;
      border-radius: 12px;
    }

    .quiz-flex-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      flex-grow: 1;
    }

    .problem-display {
      font-size: 48px;
      font-weight: 800;
      text-align: center;
      margin: 15px 0;
      letter-spacing: 2px;
    }

    .input-wrapper {
      margin-bottom: 12px;
    }

    input[type="number"], input[type="text"] {
      border: 2px solid var(--tile-bg);
      background: var(--card-bg);
      color: var(--text-color);
      border-radius: 14px;
      outline: none;
    }

    input[type="number"] {
      width: 100%;
      padding: 14px;
      font-size: 24px;
      text-align: center;
    }

    input[type="number"]:focus, input[type="text"]:focus {
      border-color: var(--primary);
    }

    .admin-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 13px;
      gap: 8px;
    }

    .admin-row input.admin-val {
      width: 65px;
      padding: 6px;
      font-size: 13px;
      text-align: center;
      border-radius: 8px;
    }

    .admin-row input.admin-txt {
      flex-grow: 1;
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 8px;
    }

    .hint-btn {
      background: none;
      color: var(--text-color);
      opacity: 0.9;
      border: 1px dashed var(--tile-bg);
      padding: 8px;
      font-size: 13px;
      border-radius: 8px;
      margin-bottom: 12px;
      cursor: pointer;
      display: inline-block;
    }

    .hint-text {
      text-align: center;
      font-size: 14px;
      color: var(--warning);
      font-weight: bold;
      min-height: 20px;
      margin-bottom: 10px;
    }

    .feedback {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      min-height: 27px;
      margin-bottom: 10px;
    }

    .shop-container-wrapper {
      flex-grow: 1;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--tile-bg);
      color: var(--text-color);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .shop-item.unlocked {
      border: 1px solid var(--success);
      background: rgba(46, 196, 182, 0.1);
    }

    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }

    .badge.locked { background: #cbd5e1; color: #64748b; }
    .badge.unlocked { background: var(--success); color: white; }

    button.action-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      z-index: 10;
    }

    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
    .animate-shake { animation: shake 0.4s ease-in-out; }
    @keyframes bounce-pop { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
    .animate-pop { animation: bounce-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .particle { position: absolute; font-size: 24px; pointer-events: none; animation: floatUp 0.8s ease-out forwards; z-index: 10; }
    @keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 1; } 100% { transform: translateY(-80px) scale(1.5); opacity: 0; } }

    /* small screens adjustments */
    @media (max-height: 700px) {
      .app-container { min-height: 480px; }
      .problem-display { font-size: 36px; }
    }
  </style>
</head>
<body ontouchstart="dismissKeyboard(event)">
  <div class="app-container" id="app">
    <div class="header-menu">
      <button class="menu-btn" id="menu-button" aria-haspopup="true" aria-expanded="false">🎨</button>
      <div id="theme-dropdown" class="dropdown-content" role="menu" aria-label="Theme and Admin menu">
        <button type="button" data-theme="default">🔵 Classic Blue</button>
        <button type="button" data-theme="sunset">🌅 Sunset Minimal</button>
        <button type="button" data-theme="forest">🌿 Forest Green</button>
        <button type="button" data-theme="dark">🌙 Deep Dark</button>
        <button class="admin-panel-item" id="open-admin" type="button">⚙️ Admin Setup</button>
      </div>
    </div>

    <!-- SCREEN 1: FACTOR SELECTOR -->
    <div id="setup-screen" class="screen active" aria-hidden="false">
      <h2>Select Tables to Quiz</h2>
      <div class="grid-container" id="grid" role="grid" aria-label="Choose tables"></div>
      <button class="action-btn" id="start-btn" type="button">Start Quiz 🚀</button>
    </div>

    <!-- SCREEN 2: ACTIVE QUIZ SCREEN -->
    <div id="quiz-screen" class="screen" aria-hidden="true">
      <form class="quiz-flex-wrapper" id="quiz-form" onsubmit="return false;">
        <div class="stats-bar">
          <span>⭐ <span id="score-display">0</span> pts</span>
          <span id="retest-indicator" style="color: var(--danger); display:none;">🔄 Retest Zone</span>
          <span>Q: <span id="q-count">1</span>/<span id="q-total">10</span></span>
        </div>

        <div class="problem-display" id="problem">0 × 0</div>
        <div class="input-wrapper">
          <input type="number" id="answer-input" pattern="[0-9]*" inputmode="numeric" placeholder="Type answer & press Go..." aria-label="Answer input">
        </div>

        <div style="text-align: center;">
          <button type="button" class="hint-btn" id="hint-button">💡 Hint? (-1 pt)</button>
        </div>

        <div style="margin-top:8px;">
          <button id="submit-btn" class="action-btn" type="button">Submit Answer</button>
        </div>

        <div class="hint-text" id="hint-display" aria-live="polite"></div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
      </form>
    </div>

    <!-- SCREEN 3: COMPLETION BALANCES OVERVIEW -->
    <div id="reward-screen" class="screen" aria-hidden="true">
      <h2>Quiz Complete!</h2>
      <div class="stats-bar" style="justify-content: center; font-size: 20px; gap: 10px; margin-bottom: 25px;">
        Total Balance: 💰 <span id="final-score">0</span> Points
      </div>
      <h3>Your Reward Milestones:</h3>
      <div id="shop-container" class="shop-container-wrapper" tabindex="0"></div>
      <button class="action-btn" id="again-btn" type="button">Practice Again 🔄</button>
    </div>

    <!-- SCREEN 4: ADMIN -->
    <div id="admin-screen" class="screen" aria-hidden="true">
      <h2>⚙️ Calibration Menu</h2>
      <div style="flex-grow: 1; overflow-y: auto; padding: 5px 2px;">
        <div class="admin-row"><strong>Feedback Hold (sec):</strong><input type="number" id="cfg-delay" class="admin-val" step="0.1" value="1.8"></div>
        <hr style="border: 0; border-top: 1px dashed var(--tile-bg); margin: 12px 0;">
        <p style="font-size: 13px; font-weight: bold; margin-bottom: 8px; opacity: 0.8;">Edit Rewards &amp; Targets:</p>
        <div class="admin-row"><input type="text" id="cfg-n1" class="admin-txt" value=""><input type="number" id="cfg-t1" class="admin-val" value="10"></div>
        <div class="admin-row"><input type="text" id="cfg-n2" class="admin-txt" value=""><input type="number" id="cfg-t2" class="admin-val" value="30"></div>
        <div class="admin-row"><input type="text" id="cfg-n3" class="admin-txt" value=""><input type="number" id="cfg-t3" class="admin-val" value="50"></div>
        <div class="admin-row"><input type="text" id="cfg-n4" class="admin-txt" value=""><input type="number" id="cfg-t4" class="admin-val" value="100"></div>
        <hr style="border: 0; border-top: 1px dashed var(--tile-bg); margin: 12px 0;">
        <button class="action-btn" id="clear-points" style="background: var(--danger); padding: 12px; font-size: 14px;" type="button">🛑 Reset All Points</button>
      </div>
      <button class="action-btn" id="save-admin" type="button">Save & Exit Setup</button>
    </div>
  </div>

  <script>
    /* ===== Utilities & state ===== */
    const el = (id) => document.getElementById(id);

    function dismissKeyboard(event) {
      const activeElement = document.activeElement;
      const inputField = el('answer-input');
      if (activeElement && activeElement.tagName === 'INPUT' && event.target !== inputField && event.target.tagName !== 'BUTTON') {
        activeElement.blur();
      }
    }

    // Safe parse helpers
    const safeInt = (v, fallback = 0) => {
      const n = parseInt(v, 10);
      return Number.isFinite(n) ? n : fallback;
    };

    /* ===== App state ===== */
    let selectedFactors = [];
    let currentScore = safeInt(localStorage.getItem('math_quiz_score'), 0);
    let currentQuestionIndex = 0;
    let currentAnswer = 0;
    let currentF1 = 0, currentF2 = 0;
    let questionStartTime = 0;
    let usedHint = false;
    let isCurrentRetest = false;
    let normalQuestionsPool = [];
    let retestQueue = [];

    let feedbackDelayDuration = safeInt(localStorage.getItem('cfg_feedback_delay'), 1800);
    // default shop
    let rewardShop = [
      { points: 10, reward: "🥉 Bronze Star Badge" },
      { points: 30, reward: "🍦 Ice Cream Treatment" },
      { points: 50, reward: "🎮 15 Mins Extra Screen Time" },
      { points: 100, reward: "🏆 Ultimate Math Grandmaster" }
    ];
    try {
      const loadedShop = JSON.parse(localStorage.getItem('cfg_shop_models') || 'null');
      if (Array.isArray(loadedShop)) {
        for (let i = 0; i < Math.min(4, loadedShop.length); i++) {
          if (loadedShop[i] && typeof loadedShop[i].points === 'number') {
            rewardShop[i].reward = String(loadedShop[i].reward || rewardShop[i].reward);
            rewardShop[i].points = loadedShop[i].points;
          }
        }
      }
    } catch (e) { /* ignore parse errors */ }

    /* ===== UI utility functions ===== */
    function setActiveScreen(id) {
      const screens = document.querySelectorAll('.screen');
      screens.forEach(s => {
        if (s.id === id) {
          s.classList.add('active');
          s.setAttribute('aria-hidden', 'false');
        } else {
          s.classList.remove('active');
          s.setAttribute('aria-hidden', 'true');
        }
      });
    }

    /* ===== Theme & menu ===== */
    const menuButton = el('menu-button');
    const themeDropdown = el('theme-dropdown');
    menuButton.addEventListener('click', () => {
      const shown = themeDropdown.classList.toggle('show');
      menuButton.setAttribute('aria-expanded', shown ? 'true' : 'false');
    });

    themeDropdown.addEventListener('click', (ev) => {
      const btn = ev.target.closest('button');
      if (!btn) return;
      const t = btn.getAttribute('data-theme');
      if (t !== null) {
        setTheme(t);
      } else if (btn.id === 'open-admin') {
        openAdminSettings();
      }
      themeDropdown.classList.remove('show');
      menuButton.setAttribute('aria-expanded', 'false');
    });

    function setTheme(themeName) {
      const docHtml = document.documentElement;
      if (themeName === 'default' || !themeName) {
        docHtml.removeAttribute('data-theme');
        localStorage.removeItem('math_quiz_theme');
      } else {
        docHtml.setAttribute('data-theme', themeName);
        localStorage.setItem('math_quiz_theme', themeName);
      }
    }
    // Initialize theme
    (function initTheme() {
      const savedTheme = localStorage.getItem('math_quiz_theme') || 'default';
      setTheme(savedTheme === 'default' ? 'default' : savedTheme);
    })();

    // Close dropdown when clicking outside
    window.addEventListener('click', (event) => {
      if (!event.target.closest('.header-menu')) {
        themeDropdown.classList.remove('show');
        menuButton.setAttribute('aria-expanded', 'false');
      }
    });

    /* ===== Audio & haptics ===== */
    let audioCtx = null;
    function initAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { audioCtx = null; }
    }
    function playSound(type) {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.value = 0.02;
      if (type === 'correct') { osc.frequency.value = 880; }
      else if (type === 'bonus') { osc.frequency.value = 1100; }
      else if (type === 'wrong') { osc.frequency.value = 220; }
      osc.type = 'sine';
      osc.start();
      setTimeout(() => { osc.stop(); }, 120);
    }
    function triggerHaptic(type) {
      if (!('vibrate' in navigator)) return;
      if (type === 'success') navigator.vibrate(40);
      else if (type === 'fail') navigator.vibrate([60, 20, 40]);
      else if (type === 'hint') navigator.vibrate(30);
    }

    function spawnParticle(text, color) {
      const container = el('app');
      const p = document.createElement('div');
      p.className = 'particle';
      p.innerText = text;
      p.style.color = color;
      // put near center
      p.style.left = (container.clientWidth / 2 - 10) + 'px';
      p.style.top = (container.clientHeight / 2 - 10) + 'px';
      container.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    }

    /* ===== Grid setup ===== */
    const grid = el('grid');
    for (let i = 1; i <= 12; i++) {
      const tile = document.createElement('div');
      tile.className = 'num-tile';
      tile.innerText = i;
      tile.setAttribute('role', 'button');
      tile.setAttribute('tabindex', '0');
      tile.setAttribute('aria-pressed', 'false');
      tile.addEventListener('click', () => toggleFactor(tile, i));
      tile.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleFactor(tile, i); } });
      grid.appendChild(tile);
    }

    function toggleFactor(tile, i) {
      const pressed = tile.getAttribute('aria-pressed') === 'true';
      tile.setAttribute('aria-pressed', (!pressed).toString());
      if (pressed) { selectedFactors = selectedFactors.filter(n => n !== i); }
      else { selectedFactors.push(i); }
    }

    /* ===== Quiz flow ===== */
    el('start-btn').addEventListener('click', startQuiz);
    el('submit-btn').addEventListener('click', submitAnswer);
    el('hint-button').addEventListener('click', revealHint);
    el('again-btn').addEventListener('click', resetApp);

    function startQuiz() {
      if (selectedFactors.length === 0) { alert("Please pick at least one number table to practice!"); return; }
      initAudio();
      currentQuestionIndex = 0;
      retestQueue = [];
      normalQuestionsPool = [];
      // make 10 questions by default
      for (let i = 0; i < 10; i++) {
        const f1 = selectedFactors[Math.floor(Math.random() * selectedFactors.length)];
        const f2 = Math.floor(Math.random() * 12) + 1;
        normalQuestionsPool.push({ f1, f2 });
      }
      el('q-total').innerText = normalQuestionsPool.length;
      setActiveScreen('quiz-screen');
      el('q-count').innerText = '0';
      generateQuestion();
    }

    function generateQuestion() {
      el('feedback').innerText = "";
      el('hint-display').innerText = "";
      el('problem').classList.remove('animate-pop', 'animate-shake');
      const inputField = el('answer-input');
      inputField.value = "";
      inputField.focus();
      usedHint = false;
      el('hint-button').disabled = false;

      const useRetest = (retestQueue.length > 0) && (Math.random() > 0.4 || normalQuestionsPool.length === 0);
      if (useRetest) {
        const problemItem = retestQueue.shift();
        currentF1 = problemItem.f1; currentF2 = problemItem.f2;
        isCurrentRetest = true;
        el('retest-indicator').style.display = 'inline';
      } else if (normalQuestionsPool.length > 0) {
        currentQuestionIndex++;
        el('q-count').innerText = currentQuestionIndex.toString();
        const problemItem = normalQuestionsPool.shift();
        currentF1 = problemItem.f1; currentF2 = problemItem.f2;
        isCurrentRetest = false;
        el('retest-indicator').style.display = 'none';
      } else {
        endQuiz();
        return;
      }

      currentAnswer = currentF1 * currentF2;
      if (Math.random() > 0.5) {
        el('problem').innerText = `${currentF1} × ${currentF2}`;
      } else {
        el('problem').innerText = `${currentF2} × ${currentF1}`;
      }
      el('problem').classList.add('animate-pop');
      questionStartTime = Date.now();
    }

    function revealHint() {
      if (usedHint) return;
      usedHint = true;
      el('hint-button').disabled = true;
      triggerHaptic('hint');
      // Simple hint: show one factor and indicate strategy
      el('hint-display').innerText = `Hint: break ${currentF1}×${currentF2} into ${currentF1}×(${currentF2}) or (${currentF1}×${Math.ceil(currentF2/2)})×2`;
      // Deduct 1 point if available
      currentScore = Math.max(0, currentScore - 1);
      el('score-display').innerText = currentScore;
      localStorage.setItem('math_quiz_score', currentScore);
    }

    function submitAnswer() {
      const inputField = el('answer-input');
      const userAnswer = parseInt(inputField.value, 10);
      const feedbackEl = el('feedback');
      const displayEl = el('problem');
      if (Number.isNaN(userAnswer)) return;

      inputField.blur();
      const timeTaken = (Date.now() - questionStartTime) / 1000;
      let pointsEarned = 0;

      if (userAnswer === currentAnswer) {
        if (usedHint) {
          feedbackEl.innerText = "✅ Correct with Hint! +1 Point";
          feedbackEl.style.color = "var(--success)";
          pointsEarned = 1;
          playSound('correct');
        } else if (timeTaken <= 4.0) {
          feedbackEl.innerText = "⚡ Lightning Fast! +4 Points";
          feedbackEl.style.color = "var(--warning)";
          pointsEarned = 4;
          playSound('bonus');
        } else {
          feedbackEl.innerText = "✅ Correct! +2 Points";
          feedbackEl.style.color = "var(--success)";
          pointsEarned = 2;
          playSound('correct');
        }

        currentScore += pointsEarned;
        triggerHaptic('success');
        spawnParticle(`+${pointsEarned}`, pointsEarned === 4 ? 'var(--warning)' : 'var(--success)');
      } else {
        feedbackEl.innerText = `❌ Incorrect. Retest added.`;
        feedbackEl.style.color = "var(--danger)";
        displayEl.classList.add('animate-shake');
        playSound('wrong');
        triggerHaptic('fail');
        // add to retest queue, cap size
        retestQueue.push({ f1: currentF1, f2: currentF2 });
        if (retestQueue.length > 20) retestQueue.shift();
      }
      el('score-display').innerText = currentScore;
      localStorage.setItem('math_quiz_score', currentScore);

      setTimeout(() => {
        displayEl.classList.remove('animate-shake');
        generateQuestion();
      }, feedbackDelayDuration);
    }

    function endQuiz() {
      setActiveScreen('reward-screen');
      el('final-score').innerText = currentScore;
      renderShop();
    }

    function renderShop() {
      const container = el('shop-container');
      container.innerHTML = '';
      rewardShop.forEach(item => {
        const isUnlocked = currentScore >= item.points;
        const div = document.createElement('div');
        div.className = 'shop-item' + (isUnlocked ? ' unlocked' : '');
        const left = document.createElement('div');
        left.innerText = item.reward;
        const right = document.createElement('div');
        const badge = document.createElement('span');
        badge.className = 'badge ' + (isUnlocked ? 'unlocked' : 'locked');
        badge.innerText = isUnlocked ? 'Unlocked' : `Locked (${item.points})`;
        right.appendChild(badge);
        div.appendChild(left);
        div.appendChild(right);
        container.appendChild(div);
      });
    }

    function resetApp() {
      setActiveScreen('setup-screen');
    }

    /* ===== Admin functions (client-side) ===== */
    function openAdminSettings() {
      themeDropdown.classList.remove('show');
      // WARNING: client-side password is not secure. For demo only.
      const entryPass = prompt("🔐 Enter Parent/Teacher Password:");
      const ADMIN_PASS = localStorage.getItem('math_admin_pass') || '1234';
      if (entryPass === null) return; // cancelled
      if (entryPass === ADMIN_PASS) {
        // populate fields
        el('cfg-delay').value = (feedbackDelayDuration / 1000).toFixed(1);
        el('cfg-n1').value = rewardShop[0].reward; el('cfg-t1').value = rewardShop[0].points;
        el('cfg-n2').value = rewardShop[1].reward; el('cfg-t2').value = rewardShop[1].points;
        el('cfg-n3').value = rewardShop[2].reward; el('cfg-t3').value = rewardShop[2].points;
        el('cfg-n4').value = rewardShop[3].reward; el('cfg-t4').value = rewardShop[3].points;
        setActiveScreen('admin-screen');
      } else {
        alert('❌ Incorrect security access password.');
      }
    }

    function saveAndExitAdmin() {
      feedbackDelayDuration = Math.max(0, parseFloat(el('cfg-delay').value) * 1000 || 1800);
      rewardShop[0].reward = el('cfg-n1').value || rewardShop[0].reward; rewardShop[0].points = safeInt(el('cfg-t1').value, rewardShop[0].points);
      rewardShop[1].reward = el('cfg-n2').value || rewardShop[1].reward; rewardShop[1].points = safeInt(el('cfg-t2').value, rewardShop[1].points);
      rewardShop[2].reward = el('cfg-n3').value || rewardShop[2].reward; rewardShop[2].points = safeInt(el('cfg-t3').value, rewardShop[2].points);
      rewardShop[3].reward = el('cfg-n4').value || rewardShop[3].reward; rewardShop[3].points = safeInt(el('cfg-t4').value, rewardShop[3].points);

      localStorage.setItem('cfg_feedback_delay', feedbackDelayDuration);
      localStorage.setItem('cfg_shop_models', JSON.stringify(rewardShop));

      alert('⚙️ Custom milestones and options updated successfully.');
      setActiveScreen('setup-screen');
    }

    function secureAdminClearPoints() {
      const clearFinalConfirmation = confirm("💥 Clear current score metrics? Rewards will lock if balance falls below parameters.");
      if (clearFinalConfirmation) {
        currentScore = 0;
        localStorage.setItem('math_quiz_score', 0);
        el('score-display').innerText = "0";
        el('final-score').innerText = "0";
        renderShop();
        triggerHaptic('fail');
        alert('Balances cleared successfully.');
      }
    }

    // wire admin buttons
    el('save-admin').addEventListener('click', saveAndExitAdmin);
    el('clear-points').addEventListener('click', secureAdminClearPoints);

    // initialize UI values
    el('score-display').innerText = currentScore;
    el('final-score').innerText = currentScore;
    renderShop();

    // accessibility: focus answer input when quiz screen shown
    const observer = new MutationObserver((mutations) => {
      mutations.forEach(m => {
        if (m.target.classList && m.target.classList.contains('screen') && m.target.classList.contains('active') && m.target.id === 'quiz-screen') {
          setTimeout(() => el('answer-input').focus(), 100);
        }
      });
    });
    document.querySelectorAll('.screen').forEach(s => observer.observe(s, { attributes: true }));

  </script>
</body>
</html>
