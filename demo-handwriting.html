<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Handwriting Digit Recognition Demo</title>
  <style>
    body { font-family: system-ui, -apple-system, Roboto, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f3f4f6; }
    .card { background:white; padding:18px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.08); width:360px; }
    canvas { background:#fff; border:1px solid #ddd; border-radius:8px; display:block; margin:8px 0; touch-action:none; }
    .row { display:flex; gap:8px; }
    .row button { flex:1; padding:8px; border-radius:8px; border:1px solid #ccc; background:#f8fafc; cursor:pointer; }
    .status { font-size:13px; color:#475569; margin-top:6px; }
    .result { font-weight:700; font-size:20px; margin-top:8px; }
  </style>
</head>
<body>
  <div class="card">
    <h3>Digit Recognizer (demo)</h3>
    <div style="font-size:13px;color:#64748b;margin-bottom:6px;">Draw a single digit 0–9 and press Recognize.</div>
    <canvas id="demo-canvas" width="280" height="200"></canvas>
    <div class="row">
      <button id="clear">Clear</button>
      <button id="eraser">Eraser</button>
      <button id="pen">Pen</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <button id="recognize">Recognize</button>
      <button id="download">Download 28×28 PNG</button>
    </div>

    <div class="status" id="status">Model: not loaded</div>
    <div class="result" id="result">—</div>
  </div>

  <script>
    // Simple demo that loads TF.js and the MNIST model used by the main app.
    const modelUrl = 'https://storage.googleapis.com/learnjs-data/model-builder/mnist/model.json';
    let tfModel = null; let tfLoaded = false; let modelLoading = false;

    const canvas = document.getElementById('demo-canvas');
    const ctx = canvas.getContext('2d');
    let drawing=false, lastX=0, lastY=0;

    function initCanvas() {
      canvas.width = 280; canvas.height = 200;
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width, canvas.height);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    }
    initCanvas();

    function setEraser(active) {
      if (active) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 22; }
      else { ctx.globalCompositeOperation = 'source-over'; ctx.lineWidth = 14; ctx.strokeStyle = '#000'; }
    }

    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return { x: (p.clientX - rect.left) * (canvas.width / rect.width), y: (p.clientY - rect.top) * (canvas.height / rect.height) };
    }
    function startDraw(e){ e.preventDefault(); drawing=true; const p=getPointerPos(e); lastX=p.x; lastY=p.y; }
    function moveDraw(e){ if(!drawing) return; e.preventDefault(); const p=getPointerPos(e); ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke(); lastX=p.x; lastY=p.y; }
    function endDraw(e){ drawing=false; }

    canvas.addEventListener('pointerdown', (e)=>{ canvas.setPointerCapture(e.pointerId); startDraw(e); });
    canvas.addEventListener('pointermove', moveDraw);
    canvas.addEventListener('pointerup', endDraw);
    canvas.addEventListener('pointercancel', endDraw);

    document.getElementById('clear').addEventListener('click', ()=>{ setEraser(false); initCanvas(); updateStatus('cleared'); });
    document.getElementById('eraser').addEventListener('click', ()=>{ setEraser(true); updateStatus('eraser'); });
    document.getElementById('pen').addEventListener('click', ()=>{ setEraser(false); updateStatus('pen'); });

    function updateStatus(t){ document.getElementById('status').innerText = 'Model: ' + (tfLoaded? 'ready' : (modelLoading? 'loading...' : 'not loaded')) + ' • ' + t; }

    async function ensureModelLoaded(){
      if (tfLoaded) return true;
      if (modelLoading) return false;
      modelLoading = true; updateStatus('loading model...');
      try {
        if (!window.tf) {
          await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
        }
        tfModel = await tf.loadLayersModel(modelUrl);
        tfLoaded = true; updateStatus('model ready'); return true;
      } catch (e) {
        console.warn('model load failed', e); updateStatus('model failed'); return false;
      } finally { modelLoading = false; }
    }

    // Improved preprocess function (robust for small single-digit strokes)
    function preprocessCanvasTo28(canvas) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      const img = ctx.getImageData(0, 0, w, h);
      const data = img.data;
      let minX = w, minY = h, maxX = 0, maxY = 0, found = false;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y*w + x) * 4;
          const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
          const lum = 0.299*r + 0.587*g + 0.114*b;
          if (a > 10 && lum < 250) { found = true; if (x < minX) minX = x; if (y < minY) minY = y; if (x > maxX) maxX = x; if (y > maxY) maxY = y; }
        }
      }
      if (!found) return null;
      const padding = 10;
      minX = Math.max(0, minX - padding); minY = Math.max(0, minY - padding);
      maxX = Math.min(w - 1, maxX + padding); maxY = Math.min(h - 1, maxY + padding);
      let boxW = maxX - minX + 1; let boxH = maxY - minY + 1; if (boxW <= 0) boxW = 1; if (boxH <= 0) boxH = 1;

      const off = document.createElement('canvas'); off.width = 28; off.height = 28; const octx = off.getContext('2d');
      octx.fillStyle = '#fff'; octx.fillRect(0,0,28,28);
      const scale = Math.min(20/boxW, 20/boxH);
      const newW = boxW * scale; const newH = boxH * scale;
      const dx = Math.round((28 - newW) / 2); const dy = Math.round((28 - newH) / 2);
      octx.imageSmoothingEnabled = true;
      octx.drawImage(canvas, minX, minY, boxW, boxH, dx, dy, newW, newH);

      const img28 = octx.getImageData(0,0,28,28);
      const out = new Float32Array(28*28);
      for (let i=0;i<28*28;i++) {
        const r = img28.data[i*4], g = img28.data[i*4+1], b = img28.data[i*4+2];
        const lum = 0.299*r + 0.587*g + 0.114*b;
        out[i] = (255 - lum) / 255.0;
      }
      return out;
    }

    async function recognize() {
      const ok = await ensureModelLoaded(); if (!ok) return;
      document.getElementById('status').innerText = 'Model: recognizing...';
      const pixels = preprocessCanvasTo28(canvas);
      if (!pixels) { document.getElementById('status').innerText = 'No strokes detected'; document.getElementById('result').innerText = '—'; return; }
      try {
        const input = tf.tensor4d(pixels, [1,28,28,1]);
        const preds = tfModel.predict(input);
        const arr = await preds.data();
        let maxIdx=0, maxV=arr[0]; for (let i=1;i<arr.length;i++) if(arr[i]>maxV){maxV=arr[i];maxIdx=i;}
        input.dispose(); preds.dispose();
        document.getElementById('status').innerText = 'Model: ready';
        document.getElementById('result').innerText = `Recognized: ${maxIdx} (confidence ${(maxV*100).toFixed(1)}%)`;
      } catch (e) {
        console.warn(e); document.getElementById('status').innerText = 'Recognition error';
      }
    }

    document.getElementById('recognize').addEventListener('click', recognize);

    // export the 28x28 prepared image for debugging
    document.getElementById('download').addEventListener('click', ()=>{
      const pixels = preprocessCanvasTo28(canvas);
      if (!pixels) { alert('No strokes detected'); return; }
      const off = document.createElement('canvas'); off.width=28; off.height=28; const octx = off.getContext('2d');
      const img = octx.createImageData(28,28);
      for (let i=0;i<28*28;i++){
        const v = 255 - Math.round(pixels[i]*255);
        img.data[i*4]=v; img.data[i*4+1]=v; img.data[i*4+2]=v; img.data[i*4+3]=255;
      }
      octx.putImageData(img,0,0);
      off.toBlob((b)=>{ const url = URL.createObjectURL(b); const a=document.createElement('a'); a.href=url; a.download='28x28.png'; a.click(); URL.revokeObjectURL(url); });
    });

    // warm model in background
    ensureModelLoaded().then(()=>updateStatus('background loaded'));
  </script>
</body>
</html>
